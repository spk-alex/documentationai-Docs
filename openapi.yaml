    "/matter-devices/{id}/SetAlarmMode": {
      "post": {
        "summary": "Switch a Matter device's alarm pushes on or off",
        "description": "Sets the device's alarm mode for every user of the device. While `enabled` is false, no AlarmTriggered or AlarmCleared of the device sends a push (each is still recorded, with `alarmsEnabled: false`, and logged as `suppressed` / `alarms-off`); turning alarms back on sends nothing until the next transition. Setting the mode the device already has records nothing (`event: null`). An organization API key may set it; a user's token only for a Matter device the user has linked.",
        "operationId": "post_SetAlarmModeRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "Matter Device ID"
