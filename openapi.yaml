    "/users/{id}/ChooseCallToOpenLock": {
      "post": {
        "summary": "Choose which locks or Matter devices open when the user calls the call-to-open number, each on its own digit",
        "description": "Stores the user's call-to-open choice: `targets`, 1 to 10 of `&#123;kind, id, digit&#125;`, each on its own digit 0-9, so a call can let the caller pick one by its digit. A target is `&#123;kind: 'lock', id&#125;` for an active entry of the user's accessible locks (any access level), or `&#123;kind: 'matter', id&#125;` for a linked device with deviceType `matter`. A target not in those lists is refused with 400. The body `&#123;kind, id&#125;` (deprecated) chooses that one target on digit 1. A user acts only for themselves; any partner API key may act for any user. Choosing the same targets on the same digits again as the same caller changes nothing (`event: null`); a new choice replaces the previous one whole, last writer wins. A choice of several targets opens nothing yet: a call is refused until it asks the caller for a digit. A preference, not an access grant: when a call from the user's own phone number reaches a dial-in number (listed by telephony-api's public `GET /dial-in-numbers`; show the one of the user's phone country, else any), the choice is checked again against the user's lists and then opened. A `matter` choice opens the lock whose uuid is the device id, and nothing when there is none. Caller ID can be spoofed, especially outside the US and Canada: not for high-security doors.",
        "operationId": "post_ChooseCallToOpenLockRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "User ID"
            },
            "required": true,
            "description": "User ID",
            "name": "id",
            "in": "path"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "targets": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "kind": {
                          "type": "string",
                          "enum": [
                            "lock",
                            "matter"
                          ],
                          "description": "Which of the user's lists the id is in: `lock` (accessible locks) or `matter` (Matter devices)"
                        },
                        "id": {
                          "type": "string",
                          "pattern": "^[A-Za-z0-9:_.-]&#123;1,128&#125;$",
                          "description": "A lock aggregate id or a Matter device id, never a phone number"
                        },
                        "digit": {
                          "type": "string",
                          "pattern": "^\\d$",
                          "description": "The key that picks this target in a call: one digit, 0-9, unique within the choice"
                        }
                      },
                      "required": [
                        "kind",
                        "id",
                        "digit"
                      ],
                      "additionalProperties": false
                    },
                    "minItems": 1,
                    "maxItems": 10,
                    "description": "Every lock or Matter device to choose, each with the digit that picks it; replaces the whole choice"
                  },
                  "kind": {
                    "type": "string",
                    "enum": [
                      "lock",
                      "matter"
                    ],
                    "description": "Deprecated, use `targets`: the one target's list, `lock` or `matter` (with `id`; on digit 1)"
                  },
                  "id": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9:_.-]&#123;1,128&#125;$",
                    "description": "Deprecated, use `targets`: the one target's id (with `kind`)"
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Target chosen (`event` is the CallToOpenLockChosen), or already chosen by the same caller (`event: null`)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "aggregateId": {
                      "type": "string"
                    },
                    "version": {
                      "type": "number"
                    },
                    "event": {
                      "type": [
                        "object",
                        "null"
                      ],
                      "properties": {
                        "type": {
                          "type": "string",
                          "enum": [
                            "CallToOpenLockChosen"
                          ]
                        },
                        "data": {
                          "type": "object",
                          "properties": {
                            "userId": {
                              "type": "string"
                            },
                            "target": {
                              "type": "object",
                              "properties": {
                                "kind": {
                                  "type": "string",
                                  "enum": [
                                    "lock",
                                    "matter"
                                  ],
                                  "description": "Which of the user's lists the id is in: `lock` (accessible locks) or `matter` (Matter devices)"
                                },
                                "id": {
                                  "type": "string",
                                  "pattern": "^[A-Za-z0-9:_.-]&#123;1,128&#125;$",
                                  "description": "A lock aggregate id or a Matter device id, never a phone number"
                                }
                              },
                              "required": [
                                "kind",
                                "id"
                              ],
                              "additionalProperties": false,
                              "description": "The target on the lowest digit"
                            },
                            "targets": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "kind": {
                                    "type": "string",
                                    "enum": [
                                      "lock",
                                      "matter"
                                    ],
                                    "description": "Which of the user's lists the id is in: `lock` (accessible locks) or `matter` (Matter devices)"
                                  },
                                  "id": {
                                    "type": "string",
                                    "pattern": "^[A-Za-z0-9:_.-]&#123;1,128&#125;$",
                                    "description": "A lock aggregate id or a Matter device id, never a phone number"
                                  },
                                  "digit": {
                                    "type": "string",
                                    "pattern": "^\\d$",
                                    "description": "The key that picks this target in a call: one digit, 0-9, unique within the choice"
                                  }
                                },
                                "required": [
                                  "kind",
                                  "id",
                                  "digit"
                                ],
                                "additionalProperties": false
                              },
                              "minItems": 1,
                              "maxItems": 10,
                              "description": "Every target of the choice, each on its own digit, ordered by digit; absent on an event written before a choice held several (its one target is on 1)"
                            },
                            "chosenBy": {
                              "type": "object",
                              "properties": {
                                "kind": {
                                  "type": "string",
                                  "enum": [
                                    "user",
                                    "organization"
                                  ],
                                  "description": "`user` for the user themselves, `organization` for an API key"
                                },
                                "orgId": {
                                  "type": [
                                    "string",
                                    "null"
                                  ],
                                  "description": "The API key's organization; null when the user acted themselves"
                                }
                              },
                              "required": [
                                "kind",
                                "orgId"
                              ]
                            },
                            "timestamp": {
                              "type": "string"
                            }
                          },
                          "required": [
                            "userId",
                            "target",
                            "chosenBy",
                            "timestamp"
                          ]
                        }
                      },
                      "required": [
                        "type",
                        "data"
                      ]
                    }
                  },
                  "required": [
                    "success",
                    "aggregateId",
                    "version",
                    "event"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "The user id is not a UUID, the body is invalid (both or neither of `targets` and `kind`/`id`, a digit that is not 0-9, a digit used twice, a target listed twice, more than 10 targets), or a target is not in the user's lists (\"Call-to-open target is not accessible to the user\")",
