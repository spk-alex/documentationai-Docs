                            "RtspCameraRegistered"
                          ]
                        },
                        "data": {
                          "type": "object",
                          "properties": {
                            "cameraId": {
                              "type": "string"
                            },
                            "name": {
                              "type": "string"
                            },
                            "rtspUrl": {
                              "type": "string"
                            },
                            "rtspHash": {
                              "type": "string"
                            },
                            "streamId": {
                              "type": "string"
                            },
                            "username": {
                              "type": "string"
                            },
                            "password": {
                              "type": "string"
                            },
                            "httpSnapshotUrl": {
                              "type": "string"
                            },
                            "ownerId": {
                              "type": "string"
                            },
                            "orgId": {
                              "type": "string"
                            },
                            "placementMode": {
                              "type": "string",
                              "enum": [
                                "async"
                              ]
                            },
                            "createdAt": {
                              "type": "string"
                            }
                          },
                          "required": [
                            "cameraId",
                            "name",
                            "rtspHash",
                            "streamId",
                            "createdAt"
                          ]
                        }
                      },
                      "required": [
                        "type",
                        "data"
                      ]
                    }
                  },
                  "required": [
