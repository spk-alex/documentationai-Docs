    "/users/{id}/call-to-open-lock": {
      "get": {
        "summary": "Get the user's call-to-open choice",
        "description": "Returns the locks or Matter devices chosen to open when the user calls the call-to-open number: `targets`, each with the digit that picks it, ordered by digit; `kind` and `id` name the one on the lowest digit; with `chosenAt` and `chosenBy.kind`. `choice: null` when none is chosen. A user reads only their own choice; any partner API key may read any user's. A preference, not an access grant.",
        "operationId": "get_GetCallToOpenLockRoute",
