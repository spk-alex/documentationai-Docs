                  "accessMode": {
                    "type": "string",
                    "enum": [
                      "public",
                      "user-whitelist"
                    ],
                    "default": "public",
                    "description": "'public': anyone with the link or the PIN; 'user-whitelist': only the listed users, signed in (no door opened by PIN)"
                  },
                  "allowedUserIds": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "default": [],
                    "description": "The users of a user-whitelist key"
                  },
