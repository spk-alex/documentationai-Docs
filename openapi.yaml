        "description": "Creates a new RtspCameraAggregate at the id in the URL. The id MUST be a UUID: it becomes the camera's object-storage prefix for life, so a name-shaped id is refused. Ownership is checked against the credentials — only an admin or a super API key may register on behalf of another owner/org; for anyone else ownerId/orgId must be their own or absent (403 otherwise). New clients should prefer POST /rtsp-cameras, which assigns the id and returns it. With video control enabled, encrypted source staging happens first and the response reports placementStatus=pending.",
        "operationId": "post_RegisterRtspCameraRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "RTSP camera UUID (aggregate id)"
            },
            "required": true,
            "description": "RTSP camera UUID (aggregate id)",
            "name": "id",
            "in": "path"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "cameraId": {
                    "type": "string",
                    "description": "Camera UUID. OPTIONAL and redundant: the id in the URL is the camera, and this is filled in from it when omitted — a DIFFERENT value here is a 400 rather than a guess, because the two used to address different things (aggregate here, storage folder there). It must be a UUID: it becomes the camera's object-storage prefix for life. New clients should let the server assign it — POST /rtsp-cameras returns the id it minted — while an integration that keeps its own uuid4 as a correlation key may go on naming it."
                  },
                  "name": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Human-readable camera name"
                  },
                  "rtspUrl": {
                    "type": "string",
                    "minLength": 1,
                    "description": "RTSP source URL (e.g. rtsp://1.2.3.4:554/stream)"
                  },
                  "username": {
                    "type": "string",
                    "description": "RTSP authentication username"
                  },
                  "password": {
                    "type": "string",
                    "description": "RTSP authentication password"
                  },
                  "httpSnapshotUrl": {
                    "type": "string",
                    "description": "Optional HTTP JPEG/PNG snapshot endpoint"
                  },
                  "onvif": {
                    "type": "object",
                    "properties": {
                      "port": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 65535,
                        "description": "ONVIF port of the camera (1-65535). Given without it, the box tries port 80 only."
                      },
                      "username": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 128,
                        "description": "ONVIF login. Given without it, the box tries the RTSP login."
                      },
                      "password": {
                        "type": "string",
                        "maxLength": 128,
                        "description": "ONVIF password. Write-only: no answer ever returns it."
                      }
                    },
                    "description": "Optional ONVIF access of the camera. Without it the VMS box uses no ONVIF for the camera and asks it for no keyframe on demand."
                  },
                  "ownerId": {
                    "type": "string",
                    "description": "B2C user ID who owns this camera. Must be the authenticated caller unless the caller is an admin or holds a super API key; omit it and the caller owns the camera."
                  },
                  "orgId": {
                    "type": "string",
                    "description": "B2B organisation that owns this camera. Same rule as ownerId: your own org, unless you are an admin or a super API key."
                  }
                },
                "required": [
                  "name",
                  "rtspUrl"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The same registration arriving twice: an idempotent no-op with `event: null` (AA-92). Nothing was created, and nothing needed to be.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
