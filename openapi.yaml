                        "lockId": {
                          "type": [
                            "string",
                            "null"
                          ],
                          "minLength": 1,
                          "description": "Lock id the door opens (caller must be authorized for it)"
                        },
                        "label": {
                          "type": "string",
                          "maxLength": 120,
                          "description": "Friendly name, e.g. \"Building entrance\""
                        },
                        "accessMethod": {
                          "type": "string",
                          "enum": [
                            "key",
                            "code",
                            "both"
                          ],
                          "default": "key",
                          "description": "How a guest gets through this door: 'key' = slide-to-open on the guest page, 'code' = the key's PIN typed at a connected entrance panel, 'both' = either. Requesting 'code' or 'both' on ANY door mints ONE PIN for the whole key, returned once in the create response."
                        }
                      }
                    },
                    "minItems": 1,
                    "maxItems": 50,
                    "description": "Doors/rooms/zones included in this shared credential"
