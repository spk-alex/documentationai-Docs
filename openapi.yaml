{
  "openapi": "3.1.0",
  "info": {
    "title": "SmartphoneKey B2C API",
    "version": "1.0.0",
    "description": "Event-sourced B2C API for SmartphoneKey smart lock management"
  },
  "servers": [
    {
      "url": "https://api.spkey.co",
      "description": "Production"
    },
    {
      "url": "https://b2c-api.spk-stage.workers.dev",
      "description": "Staging"
    },
    {
      "url": "https://b2c-api.spk-dev.workers.dev",
      "description": "Development"
    },
    {
      "url": "http://localhost:8787",
      "description": "Local"
    }
  ],
  "security": [
    {
      "BearerAuth": []
    },
    {
      "ApiKeyAuth": []
    }
  ],
  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "JWT token from SmartphoneKey authentication. Identifies the B2C user or B2B service."
      },
      "ApiKeyAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key",
        "description": "API key for B2B organization access. Provided during organization onboarding."
      }
    },
    "schemas": {},
    "parameters": {}
  },
  "paths": {
    "/rtsp-cameras/{id}/recordings/coverage": {
      "get": {
        "summary": "How many days of recordings this camera actually has in storage",
        "operationId": "get_GetRtspCameraRecordingCoverageRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "RTSP camera UUID (aggregate id)"
            },
            "required": true,
            "description": "RTSP camera UUID (aggregate id)",
            "name": "id",
            "in": "path"
          }
        ],
        "responses": {
          "200": {
            "description": "What the store holds for this camera, and the retention to compare it with",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "cameraId": {
                      "type": "string"
                    },
                    "storageConfigured": {
                      "type": "boolean"
                    },
                    "hasRecordings": {
                      "type": "boolean"
                    },
                    "oldestStartedAt": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "coverageDays": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "retentionDays": {
                      "type": "integer"
                    },
                    "recordingEnabled": {
                      "type": "boolean"
                    },
                    "lifecycleDays": {
                      "type": [
                        "integer",
                        "null"
                      ]
                    },
                    "purge": {
                      "type": [
                        "object",
                        "null"
                      ],
                      "properties": {
                        "requestId": {
                          "type": "string"
                        },
                        "olderThanDays": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "requestedAt": {
                          "type": "string"
                        },
                        "partialDeleted": {
                          "type": "integer",
                          "minimum": 0
                        }
                      },
                      "required": [
                        "requestId",
                        "olderThanDays",
                        "requestedAt",
                        "partialDeleted"
                      ]
                    },
                    "checkedAt": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "cameraId",
                    "storageConfigured",
                    "hasRecordings",
                    "oldestStartedAt",
                    "coverageDays",
                    "retentionDays",
                    "recordingEnabled",
                    "lifecycleDays",
                    "purge",
                    "checkedAt"
                  ]
                }
              }
            }
          },
          "403": {
            "description": "Forbidden — the caller is neither the owner nor a `manager` on this camera. Recordings are a manager's; a `viewer` grant opens the live stream only.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "RTSP camera not found",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "503": {
            "description": "The video control plane is not available",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          }
        },
        "tags": [
          "RtspCamera",
          "Query"
        ]
      }
    },
    "/rtsp-cameras/{id}/recordings/playback": {
      "post": {
        "summary": "Issue a signed archive playlist URL for a window",
        "operationId": "post_CreateRecordingPlaybackRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "RTSP camera UUID (aggregate id)"
            },
            "required": true,
            "description": "RTSP camera UUID (aggregate id)",
            "name": "id",
            "in": "path"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "from": {
                    "type": "string",
                    "description": "Start of the window to play, ISO-8601 UTC"
                  },
                  "to": {
                    "type": "string",
                    "description": "End of the window, ISO-8601 UTC; at most 60 minutes after `from`"
                  }
                },
                "required": [
                  "from",
                  "to"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Signed playlist URL for the window",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "playlistUrl": {
                      "type": "string",
                      "description": "Signed URL of the HLS playlist; give it to the player as is"
                    },
                    "expiresAt": {
                      "type": "integer",
                      "description": "Unix seconds after which the playlist URL stops answering"
                    }
                  },
                  "required": [
                    "playlistUrl",
                    "expiresAt"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Window malformed or longer than 60 minutes",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "403": {
            "description": "Forbidden — the caller is neither the owner nor a `manager` on this camera. Recordings are a manager's; a `viewer` grant opens the live stream only.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "RTSP camera not found",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "503": {
            "description": "Archive playback is not configured in this environment",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          }
        },
        "tags": [
          "RtspCamera",
          "Query"
        ]
      }
    },
    "/users/{id}/PhysicalKeys/{number}": {
      "get": {
        "summary": "Get a single physical key by number",
        "description": "Returns the user's physical-key entry with the given number, or 404 if no such entry exists.",
        "operationId": "get_GetPhysicalKeyRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "User ID"
            },
            "required": true,
            "description": "User ID",
            "name": "id",
            "in": "path"
          },
          {
            "schema": {
              "type": "integer",
              "exclusiveMinimum": 0,
              "description": "Physical key number"
            },
            "required": true,
            "description": "Physical key number",
            "name": "number",
            "in": "path"
          },
          {
            "schema": {
              "type": "string",
              "description": "Server-set: caller org id from API-key auth. Clients MUST NOT supply this."
            },
            "required": false,
            "description": "Server-set: caller org id from API-key auth. Clients MUST NOT supply this.",
            "name": "_callerOrgId",
            "in": "query"
          }
        ],
        "responses": {
          "200": {
            "description": "Physical key retrieved successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "number": {
                      "type": "integer",
                      "exclusiveMinimum": 0
                    },
                    "orgId": {
                      "type": "string"
                    },
                    "orgName": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "addedAt": {
                      "type": "number"
                    }
                  },
                  "required": [
                    "number",
                    "orgId",
                    "addedAt"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "User not found, or no physical key with that number",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          }
        },
        "tags": [
          "User",
          "Query",
          "Physical Keys"
        ]
      }
    },
    "/users/{id}/wallet/link": {
      "get": {
        "summary": "Get wallet install URL",
        "description": "Returns a URL the user can open to install their wallet key into Apple Wallet or Google Wallet. Returns 404 if the user has no wallet key the caller may see (partners see only their own org's key).",
        "operationId": "get_GetUserWalletLinkRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "User ID"
            },
            "required": true,
            "description": "User ID",
            "name": "id",
            "in": "path"
          },
          {
            "schema": {
              "type": "string",
              "description": "Super-admin keys and the user themself: pick the wallet key of this org"
            },
            "required": false,
            "description": "Super-admin keys and the user themself: pick the wallet key of this org",
            "name": "orgId",
            "in": "query"
          }
        ],
        "responses": {
          "200": {
            "description": "Wallet install URL retrieved successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "url": {
                      "type": "string",
                      "format": "uri"
                    },
                    "walletType": {
                      "type": "string",
                      "enum": [
                        "APPLE",
                        "GOOGLE"
                      ]
                    }
                  },
                  "required": [
                    "url",
                    "walletType"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Legacy link mode only: the user has a wallet key but no email (needed for Apple)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "The user has no wallet key this caller may see",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "410": {
            "description": "WALLET_PASS_REVOKED: the key's Google pass was revoked and is never served again",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          },
          "502": {
            "description": "WALLET_PROVIDER_ERROR: the pass provider (AccessGrid / Google) rejected the request",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          },
          "503": {
            "description": "WALLET_UNAVAILABLE: the wallet service is unreachable; WALLET_PROVISIONING_IN_PROGRESS: retry after the Retry-After seconds",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          }
        },
        "tags": [
          "User",
          "Query",
          "Wallet"
        ]
      }
    },
    "/users/{id}/wallet/revoke": {
      "post": {
        "summary": "Revoke a user's Google Wallet pass",
        "description": "Expires every saved Google Wallet object of the user's Google wallet key and clears the key it presents at a lock; the Google wallet worker serves the key no pass again. Only an API key may call it: a partner for its own org's keys, a super key for any key.",
        "operationId": "post_RevokeWalletPassRoute",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "description": "User ID"
            },
            "required": true,
            "description": "User ID",
            "name": "id",
            "in": "path"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "keyId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "The Google wallet key whose pass is revoked"
                  }
                },
                "required": [
                  "keyId"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The key's Google Wallet pass, revoked: every saved object expired with the key cleared",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "keyId": {
                      "type": "string"
                    },
                    "walletType": {
                      "type": "string",
                      "enum": [
                        "GOOGLE"
                      ]
                    },
                    "revokedAt": {
                      "type": "string",
                      "description": "When the key's pass was first revoked"
                    },
                    "revoked": {
                      "type": "integer",
                      "description": "Google Wallet objects a person holds, now expired with the key cleared"
                    },
                    "notSaved": {
                      "type": "integer",
                      "description": "Objects of the key no one holds, expired too: a never-saved one is created expired so that none can be saved active"
                    }
                  },
                  "required": [
                    "keyId",
                    "walletType",
                    "revokedAt",
                    "revoked",
                    "notSaved"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "No keyId in the body (Ceves error body), or WALLET_REVOKE_UNSUPPORTED: the key is not a Google Wallet key",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "type": "object",
                      "properties": {
                        "success": {
                          "type": "boolean"
                        },
                        "errors": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "code": {
                                "type": "number"
                              },
                              "message": {
                                "type": "string"
                              }
                            },
                            "required": [
                              "code",
                              "message"
                            ]
                          }
                        }
                      },
                      "required": [
                        "success",
                        "errors"
                      ]
                    },
                    {
                      "type": "object",
                      "properties": {
                        "error": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "error"
                      ]
                    }
                  ]
                }
              }
            }
          },
          "403": {
            "description": "The caller is not an API key: only the key's organization or an administrator revokes a pass",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "errors": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "code": {
                            "type": "number"
                          },
                          "message": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "code",
                          "message"
                        ]
                      }
                    }
                  },
                  "required": [
                    "success",
                    "errors"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "No such user, or no such wallet key of the caller's org (Ceves error body), or WALLET_PASS_NOT_FOUND",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "type": "object",
                      "properties": {
                        "success": {
                          "type": "boolean"
                        },
                        "errors": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "code": {
                                "type": "number"
                              },
                              "message": {
                                "type": "string"
                              }
                            },
                            "required": [
                              "code",
                              "message"
                            ]
                          }
                        }
                      },
                      "required": [
                        "success",
                        "errors"
                      ]
                    },
                    {
                      "type": "object",
                      "properties": {
                        "error": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "error"
                      ]
                    }
                  ]
                }
              }
            }
          },
          "502": {
            "description": "WALLET_PROVIDER_ERROR: Google failed or refused; safe to retry (the pass is already refused)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          },
          "503": {
            "description": "WALLET_UNAVAILABLE: the Google wallet service is not bound or unreachable",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
