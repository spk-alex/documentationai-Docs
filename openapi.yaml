                      "type": [
                        "object",
                        "null"
                      ],
                      "properties": {
                        "kind": {
                          "type": "string",
                          "enum": [
                            "lock",
                            "matter"
                          ],
                          "description": "Which list the chosen id is in (the target on the lowest digit)"
                        },
                        "id": {
                          "type": "string",
                          "description": "The chosen lock aggregate id or Matter device id (the target on the lowest digit)"
                        },
                        "targets": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "kind": {
                                "type": "string",
                                "enum": [
                                  "lock",
                                  "matter"
                                ],
