      "post": {
        "summary": "Create a collective / shared temporary access key",
        "description": "Generates one shared guest credential spanning multiple doors. Each door is opened by slide-to-open ('key'), by the key's PIN at a connected entrance panel ('code'), or either ('both'). If any door is code/both, ONE PIN is minted for the whole key and returned here — this response is the only place it is ever returned in the clear. The caller must be authorized for every lock included.",
        "operationId": "post_CreateUnifiedTempKeyRoute",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "validFrom": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "validUntil": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "description": {
                    "type": "string",
                    "maxLength": 2000
                  },
                  "doors": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "lockId": {
                          "type": [
                            "string",
                            "null"
                          ],
                          "minLength": 1,
                          "description": "Lock id the door opens (caller must be authorized for it)"
                        },
                        "label": {
                          "type": "string",
                          "maxLength": 120,
                          "description": "Friendly name, e.g. \"Building entrance\""
                        },
                        "accessMethod": {
                          "type": "string",
                          "enum": [
                            "key",
                            "code",
                            "both"
                          ],
                          "default": "key",
                          "description": "How a guest gets through this door: 'key' = slide-to-open on the guest page, 'code' = the key's PIN typed at a connected entrance panel, 'both' = either. Requesting 'code' or 'both' on ANY door mints ONE PIN for the whole key, returned once in the create response."
                        }
                      }
                    },
                    "minItems": 1,
                    "maxItems": 50,
                    "description": "Doors/rooms/zones included in this shared credential"
